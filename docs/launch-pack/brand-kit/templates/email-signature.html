<!doctype html>
<html lang="en-GB">
<head><meta charset="utf-8"><title>Email signature · Threadline</title></head>
<body style="margin:0;padding:24px;background:#ffffff;">
<!--
  Threadline email signature. Table-based with inline styles so it survives Gmail, Outlook and Apple Mail.
  Replace every {{placeholder}}. Keep two or three links at most (outreach playbook: LinkedIn, the website, one content profile).
  Email clients do not show SVG: host logo/png/threadline-lockup-light-512w.png at a stable https URL and put it in {{logo_url}}.
  The relative src below is only for previewing this file. Brand-led: no photograph, no invented titles.
-->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" style="border-collapse:collapse;font-family:Inter,Arial,Helvetica,sans-serif;color:#17233a;">
  <tr>
    <td style="padding:0 0 10px 0;">
      <img src="../logo/png/threadline-lockup-light-512w.png" data-hosted-src="{{logo_url}}" width="170" height="26" alt="Threadline" style="display:block;border:0;width:170px;height:auto;">
    </td>
  </tr>
  <tr>
    <td style="padding:0;border-top:2px solid #c88b2d;line-height:0;font-size:0;width:170px;">&nbsp;</td>
  </tr>
  <tr>
    <td style="padding:10px 0 0 0;font-size:14px;line-height:20px;">
      <span style="font-weight:600;">{{name}}</span><br>
      <span style="color:#3b475e;">{{role}}, Threadline</span>
    </td>
  </tr>
  <tr>
    <td style="padding:8px 0 0 0;font-size:13px;line-height:19px;color:#3b475e;">
      <a href="{{website_url}}" style="color:#1f63d6;text-decoration:none;">{{website_label}}</a>
      &nbsp;·&nbsp;<a href="{{linkedin_url}}" style="color:#1f63d6;text-decoration:none;">LinkedIn</a>
      &nbsp;·&nbsp;<a href="mailto:{{email}}" style="color:#1f63d6;text-decoration:none;">{{email}}</a>
    </td>
  </tr>
  <tr>
    <td style="padding:10px 0 0 0;font-size:11px;line-height:16px;color:#6b768a;max-width:420px;">
      {{registered_business_name_and_postal_address — required on commercial email (UK PECR / US CAN-SPAM)}}
    </td>
  </tr>
</table>
</body>
</html>

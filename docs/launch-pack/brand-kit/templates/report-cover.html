<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>{{report_title}} · cover · Threadline</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="_brand.css">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #fff; }
  .cover { position: relative; width: 210mm; height: 297mm; margin: 0 auto; padding: 22mm 20mm; background: var(--tl-canvas); color: var(--tl-ink); font: 400 11pt/1.5 var(--tl-sans); display: flex; flex-direction: column; overflow: hidden; }
  .cover img.logo { height: 8mm; align-self: flex-start; }
  .panel { margin-top: auto; background: var(--tl-panel); border-radius: 10mm; padding: 16mm 14mm 14mm; }
  .eyebrow { font-size: 9pt; font-weight: 600; letter-spacing: .16em; text-transform: uppercase; color: var(--tl-ink-faint); margin: 0 0 5mm; }
  h1 { margin: 0; font: 400 46pt/1 var(--tl-serif); letter-spacing: -.015em; }
  h1 em { font-style: italic; color: var(--tl-ink-soft); }
  .thread { display: block; width: 100%; height: 14mm; margin: 9mm 0 7mm; }
  dl { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4mm; margin: 0; }
  dt { font-size: 7.5pt; letter-spacing: .14em; text-transform: uppercase; color: var(--tl-ink-faint); } dd { margin: 1mm 0 0; font-weight: 500; }
  .foot { margin-top: 10mm; font-size: 8pt; color: var(--tl-ink-faint); display: flex; justify-content: space-between; }
</style>
</head>
<body>
<section class="cover">
  <img class="logo" src="../logo/svg/threadline-lockup-light.svg" alt="Threadline">
  <div class="panel">
    <p class="eyebrow">{{report_type, e.g. Four-week review}}</p>
    <h1>{{report_title_line_one}}<br><em>{{report_title_line_two}}</em></h1>
    <!-- The thread: the mark's own curve, stretched as a rule. Decorative. -->
    <svg class="thread" viewBox="0 0 600 40" preserveAspectRatio="none" aria-hidden="true"><path d="M2 32 C60 32 70 8 120 8 C170 8 180 32 230 32 C280 32 290 8 340 8 C390 8 400 32 450 32 C500 32 520 20 598 20" fill="none" stroke="#c88b2d" stroke-width="2.2" stroke-linecap="round" vector-effect="non-scaling-stroke"/></svg>
    <dl>
      <div><dt>Prepared for</dt><dd>{{client_name}}</dd></div>
      <div><dt>Period</dt><dd>{{period}}</dd></div>
      <div><dt>Date</dt><dd>{{date}}</dd></div>
    </dl>
  </div>
  <div class="foot"><span>Threadline</span><span>Confidential · {{version}}</span></div>
</section>
</body>
</html>

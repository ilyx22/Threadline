<!doctype html><html><head><meta charset='utf-8'><title>Threadline newsletter graphics: contact sheet</title><style>body{margin:0;padding:20px;background:#fff;font:14px/1.3 Inter,system-ui,sans-serif;color:#17233a}main{display:grid;grid-template-columns:repeat(5,300px);gap:20px}figure{margin:0}img{width:300px;height:375px;display:block;border:1px solid rgba(23,35,58,.12)}figcaption{margin-top:6px;font-size:13px;color:#3b475e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><main><figure><img src='export/01-expertise-to-qualified-demand-journey-1200.png' alt='A thread runs through eight numbered steps. Inside the firm: 1 expertise captured from calls, notes and decisions; 2 positioned for one buyer and one expensive problem; 3 expressed in the founder&#39;s voice in native formats; 4 distributed where those buyers already read. In the market: 5 the right buyers notice; 6 trust builds through repeated, useful, specific pieces; 7 they respond with a reply, a visit or a referral; 8 a qualified conversation, the outcome that counts.'><figcaption>01-expertise-to-qualified-demand-journey</figcaption></figure><figure><img src='export/02-diagnosis-improvement-loop-1200.png' alt='A loop of five stations: Score (rate the piece against a stated rubric), Explain (which parts carried it), Diagnose (idea, packaging or distribution), Prescribe (change one variable), Retest (read it again on the same root idea). At the centre: expected versus actual, with the expectation frozen before publishing. Each cycle logs what we believed, what happened, which assumption failed and what changes next.'><figcaption>02-diagnosis-improvement-loop</figcaption></figure><figure><img src='export/03-human-ai-draft-human-review-1200.png' alt='Three lanes: founder, AI drafting, Threadline team. The founder talks and records the raw expertise; the AI writes a first draft from that source and the Brand Brain; the Threadline team checks facts, voice, claims and evidence; the founder approves that exact version, which is the gate; the team publishes only what was approved. The AI drafts and never publishes. A draft changed after approval comes back for approval.'><figcaption>03-human-ai-draft-human-review</figcaption></figure><figure><img src='export/04-pesto-content-mix-1200.png' alt='PESTO content mix, after Marcos Ruiz (Vantage): Personal (a story from your own experience), Expertise (how the work is actually done), Social proof (only with permission, never invented), Trending (a current event read through your lens) and Opinion (a position you would defend to peers). A dashed bar of five equal slices is marked &#39;not the goal&#39;; a second bar shows one client&#39;s illustrative weighting, led by expertise and opinion. Weights follow the evidence for each client and change.'><figcaption>04-pesto-content-mix</figcaption></figure><figure><img src='export/05-content-plus-outbound-system-1200.png' alt='A stack of layers under one destination, market memory: when a buyer has the problem, your name comes to mind. From the top: organic content creates familiarity and authority; outbound reaches specific buyers directly; the profile and content library prove competence when prospects check you; paid, dashed as later, only once message and proof are strong; attribution shows which combinations move buyers; the learning loop improves every layer each cycle.'><figcaption>05-content-plus-outbound-system</figcaption></figure><figure><img src='export/06-views-attention-qualified-demand-1200.png' alt='Three stacked tiers narrowing downwards. Views: someone&#39;s feed showed it; easy to count, says little. Attention: the right person stopped and stayed; harder to see, worth more. Qualified demand: a buyer who fits asked to talk; rare, the point. Beneath: &#39;Views are an observation, not an outcome.&#39; The shapes show order, not quantities.'><figcaption>06-views-attention-qualified-demand</figcaption></figure><figure><img src='export/07-one-idea-native-formats-1200.png' alt='One root idea at the top, &#39;More content can&#39;t fix unclear positioning&#39;, branches along a single thread into six native formats: a short video that shows it in under a minute, an X post with the argument kept tight, a LinkedIn decision memo, a Threads conversation opener, a diagram of the mechanism, and a YouTube piece with the full depth. Every piece keeps its root idea&#39;s ID, so the learning adds up.'><figcaption>07-one-idea-native-formats</figcaption></figure><figure><img src='export/08-sales-objections-to-content-1200.png' alt='Flow across the top: heard on a call, logged, becomes a piece, seen before the next call. A table of illustrative examples follows. &#39;We tried content. It got likes, not clients.&#39; is logged as proof and becomes &#39;Why views mislead, and what to read instead&#39;. &#39;AI content all sounds the same.&#39; is logged as AI and becomes &#39;How a human check keeps your voice yours&#39;. &#39;I don&#39;t have time for this.&#39; is logged as time and becomes &#39;What you actually do: talk, record, approve, sell&#39;. &#39;Can&#39;t we just post more?&#39; is logged as alternatives and becomes &#39;Why more volume can amplify the wrong thing&#39;.'><figcaption>08-sales-objections-to-content</figcaption></figure><figure><img src='export/09-what-implementation-establishes-1200.png' alt='Six ticked blocks: what implementation establishes. Positioning: who it is for and the expensive problem. Brand Brain: beliefs, stories, proof and limits, confirmed by you. Voice guide: how you sound and what you would never say. Workflow: who records, reviews and approves, and when. Measurement: the baseline and what we read each period. First content: the first pieces in production. Set up once, at the start; everything after runs on it.'><figcaption>09-what-implementation-establishes</figcaption></figure><figure><img src='export/10-four-week-review-cycle-1200.png' alt='A calendar of four-week periods. Period 1, weeks 1 to 4: establish and calibrate. Period 2, weeks 5 to 8: refine and correct. Period 3, weeks 9 to 12: compound and concentrate. Period 4 onwards, dashed: compound harder. Each period ends in a four-week review. The first engagement is periods 1 to 3, twelve weeks. Every review follows the same four headings: action (what we did), results (what happened), problems (what went wrong) and future (what changes next).'><figcaption>10-four-week-review-cycle</figcaption></figure></main></body></html>

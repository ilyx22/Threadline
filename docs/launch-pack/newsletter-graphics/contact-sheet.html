<!doctype html><html><head><meta charset='utf-8'><title>Threadline newsletter graphics: contact sheet</title><style>body{margin:0;padding:20px;background:#fff;font:14px/1.3 Inter,system-ui,sans-serif;color:#17233a}main{display:grid;grid-template-columns:repeat(7,300px);gap:20px}figure{margin:0}img{width:300px;height:375px;display:block;border:1px solid rgba(23,35,58,.12)}figcaption{margin-top:6px;font-size:13px;color:#3b475e;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style></head><body><main><figure><img src='export/01-expertise-to-qualified-demand-journey-1200.png' alt='A thread runs through eight numbered steps. Inside the firm: 1 expertise captured from calls, notes and decisions; 2 positioned for one buyer and one expensive problem; 3 expressed in the founder&#x27;s voice in native formats; 4 distributed where those buyers already read. In the market: 5 the right buyers notice; 6 trust builds through repeated, useful, specific pieces; 7 they respond with a reply, a visit or a referral; 8 a qualified conversation, the outcome that counts.'><figcaption>01-expertise-to-qualified-demand-journey</figcaption></figure><figure><img src='export/02-diagnosis-improvement-loop-1200.png' alt='A loop of five stations: Score (rate the piece against a stated rubric), Explain (which parts carried it), Diagnose (idea, packaging or distribution), Prescribe (change one variable), Retest (read it again on the same root idea). At the centre: expected versus actual, with the expectation frozen before publishing. Each cycle logs what we believed, what happened, which assumption failed and what changes next.'><figcaption>02-diagnosis-improvement-loop</figcaption></figure><figure><img src='export/03-human-ai-draft-human-review-1200.png' alt='Three lanes: founder, AI drafting, Threadline team. The founder talks and records the raw expertise; the AI writes a first draft from that source and the Brand Brain; the Threadline team checks facts, voice, claims and evidence; the founder approves that exact version, which is the gate; the team publishes only what was approved. The AI drafts and never publishes. A draft changed after approval comes back for approval.'><figcaption>03-human-ai-draft-human-review</figcaption></figure><figure><img src='export/04-pesto-content-mix-1200.png' alt='PESTO content mix, after Marcos Ruiz (Vantage): Personal (a story from your own experience), Expertise (how the work is actually done), Social proof (only with permission, never invented), Trending (a current event read through your lens) and Opinions (positions you would defend to peers). A dashed bar of five equal slices is marked &#x27;not the goal&#x27;; a second bar shows one client&#x27;s illustrative weighting, led by expertise and opinions. Weights follow the evidence for each client and change.'><figcaption>04-pesto-content-mix</figcaption></figure><figure><img src='export/05-content-plus-outbound-system-1200.png' alt='A stack of layers under one destination, market memory: when a buyer has the problem, your name comes to mind. From the top: organic content creates familiarity and authority; outbound reaches specific buyers directly; the profile and content library prove competence when prospects check you; paid, dashed as later, only once message and proof are strong; attribution shows which combinations move buyers; the learning loop improves every layer each cycle.'><figcaption>05-content-plus-outbound-system</figcaption></figure><figure><img src='export/06-views-attention-qualified-demand-1200.png' alt='Three stacked tiers narrowing downwards. Views: someone&#x27;s feed showed it; easy to count, says little. Attention: the right person stopped and stayed; harder to see, worth more. Qualified demand: a buyer who fits asked to talk; rare, the point. Beneath: &#x27;Views are an observation, not an outcome.&#x27; The shapes show order, not quantities.'><figcaption>06-views-attention-qualified-demand</figcaption></figure><figure><img src='export/07-one-idea-native-formats-1200.png' alt='One root idea at the top, &#x27;More content can&#x27;t fix unclear positioning&#x27;, branches along a single thread into six native formats: a short video that shows it in under a minute, an X post with the argument kept tight, a LinkedIn decision memo, a Threads conversation opener, a diagram of the mechanism, and a YouTube piece with the full depth (a pilot). Every piece keeps its root idea&#x27;s ID, so the learning adds up. Illustrative: the mix is prescribed per client, and long-form YouTube is a pilot.'><figcaption>07-one-idea-native-formats</figcaption></figure><figure><img src='export/08-sales-objections-to-content-1200.png' alt='Flow across the top: heard on a call, logged, becomes a piece, seen before the next call. A table of illustrative examples follows. &#x27;We tried content. It got likes, not clients.&#x27; is logged as proof and becomes &#x27;Why views mislead, and what to read instead&#x27;. &#x27;AI content all sounds the same.&#x27; is logged as AI and becomes &#x27;How a human check keeps your voice yours&#x27;. &#x27;I don&#x27;t have time for this.&#x27; is logged as time and becomes &#x27;What you actually do: talk, record, approve, sell&#x27;. &#x27;Can&#x27;t we just post more?&#x27; is logged as alternatives and becomes &#x27;Why more volume can amplify the wrong thing&#x27;.'><figcaption>08-sales-objections-to-content</figcaption></figure><figure><img src='export/09-what-implementation-establishes-1200.png' alt='Six ticked blocks: what implementation establishes. Positioning: who it is for and the expensive problem. Brand Brain: beliefs, stories, proof and limits, confirmed by you. Voice guide: how you sound and what you would never say. Workflow: who records, reviews and approves, and when. Measurement: the baseline and what we read each period. First content: the first pieces in production. Set up once, at the start; everything after runs on it.'><figcaption>09-what-implementation-establishes</figcaption></figure><figure><img src='export/10-four-week-review-cycle-1200.png' alt='A calendar of four-week periods. Period 1, weeks 1 to 4: establish / calibrate. Period 2, weeks 5 to 8: refine / correct. Period 3, weeks 9 to 12: compound / concentrate. Period 4 onwards, dashed: compound harder. Each period ends in a four-week review. The first engagement is periods 1 to 3, twelve weeks. Every review follows the same four headings: action (what we did), results (what happened), problems (what went wrong) and future (what changes next).'><figcaption>10-four-week-review-cycle</figcaption></figure><figure><img src='export/11-newsletter-masthead-template-1200.png' alt='Newsletter masthead template: a dark panel with the Threadline thread mark, the title &#x27;Field Notes&#x27;, placeholders for issue number and date, and the line &#x27;Notes from the workshop: what we tested, what happened, what changes next.&#x27; Below, an &#x27;In this issue&#x27; list with three headline placeholders.'><figcaption>11-newsletter-masthead-template</figcaption></figure><figure><img src='export/12-content-bottleneck-diagnostic-1200.png' alt='A diagnostic grid for where content stalls, with four columns: where it stalls, what you see, the likely cause and the first check. Ideas: blank page every week, nothing captured from calls, mine last month&#x27;s call notes. Scripts: drafts sound generic, voice and claims not written down, check the Brand Brain. Recording: sessions keep slipping, setup friction and no fixed slot, book one recurring slot. Editing: cuts come back wrong, no agreed editing standard, agree examples before cutting. Approvals: pieces wait for sign-off, one approver and no backup, name a backup approver. Publishing: approved but not live, manual posting falls through, schedule when approved. Learning: same result every week, no expected versus actual, freeze a forecast before posting. Find the first stage that stalls and fix that one before adding volume.'><figcaption>12-content-bottleneck-diagnostic</figcaption></figure><figure><img src='export/13-attribution-evidence-ladder-1200.png' alt='An evidence ladder from strongest to weakest. Directly tracked: a tracked link or code ties the enquiry to the piece. Buyer named it (buyer-named, client-attributed): the buyer told the client which piece brought them. Multi-touch influenced: several pieces touched the path, none alone. Associated or correlated: moved together in time, cause not shown. Qualitative only: a comment or impression, not counted. Every result carries its class; do not overclaim causality. Organic content is not paid media, so most results sit on the lower rungs.'><figcaption>13-attribution-evidence-ladder</figcaption></figure><figure><img src='export/14-case-study-layout-template-1200.png' alt='A case-study layout template containing placeholders only, marked TEMPLATE: client and sector, permission status and date, then five blocks: baseline (dated, before the engagement), what changed, measured result with its evidence class, client-reported commercial outcome, and inference, labelled as a reading rather than a measurement. Publish only with written permission and keep measured, reported and inferred results apart. It contains no real results.'><figcaption>14-case-study-layout-template</figcaption></figure></main></body></html>

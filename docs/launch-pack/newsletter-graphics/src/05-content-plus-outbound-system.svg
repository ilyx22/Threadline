<text x="72" y="206" font-family="&#x27;Instrument Serif&#x27;, &#x27;Iowan Old Style&#x27;, Georgia, serif" font-size="72" font-weight="400" fill="#17233a" text-anchor="start"><tspan x="72" dy="0">Content and outbound</tspan><tspan x="72" dy="77.8">work as one system</tspan></text>

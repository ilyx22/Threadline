<text x="108" y="1166" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="30" font-weight="400" fill="#3b475e" text-anchor="start"><tspan x="108" dy="0">shows which combinations move buyers</tspan></text>

<text x="108" y="396" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="22" font-weight="600" fill="#a9cdea" text-anchor="start" letter-spacing="2.5"><tspan x="108" dy="0">WHERE IT LEADS: MARKET MEMORY</tspan></text>
<text x="108" y="438" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="28" font-weight="400" fill="#ffffff" text-anchor="start"><tspan x="108" dy="0">When a buyer has the problem, your name comes to mind.</tspan></text>
<line x1="600" y1="514" x2="600" y2="470" stroke="#17233a" stroke-width="3" stroke-linecap="round" marker-end="url(#arr)"/>
<rect x="72" y="520" width="1056" height="124" rx="22" fill="#dbeaf7" stroke="#17233a" stroke-width="3"/>
<text x="108" y="570" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="24" font-weight="600" fill="#17233a" text-anchor="start" letter-spacing="2.5"><tspan x="108" dy="0">ORGANIC CONTENT</tspan></text>
<text x="108" y="614" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="30" font-weight="400" fill="#3b475e" text-anchor="start"><tspan x="108" dy="0">creates familiarity and authority</tspan></text>
<rect x="72" y="658" width="1056" height="124" rx="22" fill="#ffe4d6" stroke="#17233a" stroke-width="3"/>
<text x="108" y="708" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="24" font-weight="600" fill="#17233a" text-anchor="start" letter-spacing="2.5"><tspan x="108" dy="0">OUTBOUND</tspan></text>
<text x="108" y="752" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="30" font-weight="400" fill="#3b475e" text-anchor="start"><tspan x="108" dy="0">reaches specific buyers directly</tspan></text>

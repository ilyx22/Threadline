<text x="108" y="1304" font-family="Inter, &#x27;Segoe UI&#x27;, system-ui, sans-serif" font-size="30" font-weight="400" fill="#3b475e" text-anchor="start"><tspan x="108" dy="0">improves every layer above, each cycle</tspan></text>

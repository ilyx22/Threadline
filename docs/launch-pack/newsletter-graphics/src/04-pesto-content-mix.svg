<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="t4 d4">
<title id="t4">A content mix you tune, not a formula you split</title><desc id="d4">PESTO content mix, after Marcos Ruiz (Birdhouse): Personal (a story from your own experience), Expertise (how the work is actually done), Social proof (only with permission, never invented), Trending (a current event read through your lens) and Opinions (positions you would defend to peers). A dashed bar of five equal slices is marked &#x27;not the goal&#x27;; a second bar shows one client&#x27;s illustrative weighting, led by expertise and opinions. Weights follow the evidence for each client and change.</desc>

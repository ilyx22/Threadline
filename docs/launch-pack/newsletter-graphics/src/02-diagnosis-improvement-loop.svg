<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1500" viewBox="0 0 1200 1500" role="img" aria-labelledby="t2 d2">
<title id="t2">Every piece is a test, read honestly</title><desc id="d2">A loop of five stations: Score (rate the piece against a stated rubric), Explain (which parts carried it), Diagnose (idea, packaging or distribution), Prescribe (change one variable), Retest (read it again on the same root idea). At the centre: expected versus actual, with the expectation frozen before publishing. Each cycle logs what we believed, what happened, which assumption failed and what changes next.</desc>

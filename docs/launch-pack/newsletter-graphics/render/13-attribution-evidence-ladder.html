<title id="t13">How strong is the evidence?</title><desc id="d13">An evidence ladder from strongest to weakest. Directly tracked: a tracked link or code ties the enquiry to the piece. Buyer named it (buyer-named, client-attributed): the buyer told the client which piece brought them. Multi-touch influenced: several pieces touched the path, none alone. Associated or correlated: moved together in time, cause not shown. Qualitative only: a comment or impression, not counted. Every result carries its class; do not overclaim causality. Organic content is not paid media, so most results sit on the lower rungs.</desc>

<title id="t12">Where content actually stalls</title><desc id="d12">A diagnostic grid for where content stalls, with four columns: where it stalls, what you see, the likely cause and the first check. Ideas: blank page every week, nothing captured from calls, mine last month&#x27;s call notes. Scripts: drafts sound generic, voice and claims not written down, check the Brand Brain. Recording: sessions keep slipping, setup friction and no fixed slot, book one recurring slot. Editing: cuts come back wrong, no agreed editing standard, agree examples before cutting. Approvals: pieces wait for sign-off, one approver and no backup, name a backup approver. Publishing: approved but not live, manual posting falls through, schedule when approved. Learning: same result every week, no expected versus actual, freeze a forecast before posting. Find the first stage that stalls and fix that one before adding volume.</desc>

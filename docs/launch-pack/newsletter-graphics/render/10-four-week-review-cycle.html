<title id="t10">The four-week review cycle</title><desc id="d10">A calendar of four-week periods. Period 1, weeks 1 to 4: establish and calibrate. Period 2, weeks 5 to 8: refine and correct. Period 3, weeks 9 to 12: compound and concentrate. Period 4 onwards, dashed: compound harder. Each period ends in a four-week review. The first engagement is periods 1 to 3, twelve weeks. Every review follows the same four headings: action (what we did), results (what happened), problems (what went wrong) and future (what changes next).</desc>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Clone baseline — hero paper panel (reference: thebirdhouse.co hero, captured 2026-09-09)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* CLEAN-ROOM CLONE. Geometry, type scale and surfaces transcribed from
     reference-analysis/birdhouse/components/hero-panel/<width>.measure.json and the site typography census.
     Copy is neutral placeholder text; the illustration cluster is a neutral grey stand-in of the same footprint. */
  :root { --canvas: #def3ff; --paper: #fff; --navy: #04324d; --cyan: #00acee; --serif: "Instrument Serif", Georgia, serif; --sans: "Roboto", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  html { background: var(--canvas); color: var(--navy); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
  body { margin: 0; }

  .section { padding: 0; }
  .pad { padding: 80px 30px 24px; }                                                        /* [0/0] paddingTop 80, sides 30; section 1017 = 80 + 913 + 24 */
  .wrapper { position: relative; overflow: hidden; max-width: 1500px; margin: 0 auto; background: var(--paper); border-radius: 60px; padding: 64px 0 0; min-height: 913px; }   /* [0/0/0] 1380×913 at 1440 */
  .container { position: relative; z-index: 1; max-width: 1280px; margin: 0 auto; padding: 0 20px; }   /* [0/0/0/0] 1280 centred in 1380. The reference text block was captured mid-reveal (translateY 20.56px, opacity .31); its settled position is the container top. */
  .text { display: flex; flex-direction: column; gap: 32px; max-width: 500px; }                /* [0/0/0/0/0] */
  .title-wrap { display: flex; flex-direction: column; gap: 5px; }                            /* [0/0/0/0/0/0] */
  .eyebrow { margin: 0; font-family: var(--serif); font-style: italic; font-size: 26px; line-height: 26px; color: var(--cyan); font-weight: 400; }   /* [0/0/0/0/0/0/0] */
  h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: 90px; line-height: 1.1; color: var(--navy); }   /* h1-90: 90/99 */
  .lead { margin: 0; font-size: 20px; line-height: 24px; color: var(--navy); }              /* [0/0/0/0/0/1] */
  .cta-flex { display: flex; }
  .btn { display: inline-flex; align-items: center; gap: 10px; min-height: 60px; padding: 0 40px; border-radius: 60px; background: var(--cyan); color: #fff; font-size: 18px; font-weight: 700; line-height: 18px; text-decoration: none; transition: all .3s ease; }   /* [0/0/0/0/0/2/0] 156×60 */
  .btn:hover { transform: translateY(-2px); }
  .btn svg { width: 20px; height: 15px; }

  .art { position: absolute; right: 0; bottom: 0; width: 85%; aspect-ratio: 1173 / 724; pointer-events: none; }   /* [0/0/0/1/1] cluster footprint = 85% of the wrapper width (1173/1380 @1440, 819/964 @1024), bottom-right, overlapping the panel edge */
  .art svg { width: 100%; height: 100%; display: block; }

  @media (max-width: 991px) {                                                               /* tablet (measured at 768): stacked, radius 60, sides 30, h1 64/70.4, lead 14/16.8 */
    .wrapper { min-height: 0; padding-top: 22px; }
    .text { max-width: 100%; align-items: center; text-align: center; }
    h1 { font-size: 64px; line-height: 1.1; }
    .lead { font-size: 14px; line-height: 16.8px; }
    .art { position: static; width: 100%; aspect-ratio: auto; height: 560px; margin-top: -12px; }
  }
  @media (max-width: 767px) {                                                               /* phone (measured at 390): radius 30, sides 10, eyebrow 14, h1 48/52.8, gap 20 */
    .pad { padding: 80px 10px 24px; }
    .wrapper { border-radius: 30px; padding: 22px 0 0; }
    .text { gap: 20px; }
    .eyebrow { font-size: 14px; line-height: 14px; }
    h1 { font-size: 48px; line-height: 1.1; }
    .lead { font-size: 14px; line-height: 16.8px; }
    .btn { border-radius: 30px; padding: 0 30px; }
    .art { height: 356px; }
  }
</style>
</head>
<body>
<section class="section" data-tl-capture="root" data-ref="0">
  <div class="pad" data-ref="0/0">
    <div class="wrapper" data-ref="0/0/0">
      <div class="container" data-ref="0/0/0/0">
        <div class="text" data-ref="0/0/0/0/0">
          <div class="title-wrap" data-ref="0/0/0/0/0/0">
            <p class="eyebrow" data-ref="0/0/0/0/0/0/0">Named audience, in three words:</p>
            <div data-ref="0/0/0/0/0/0/1"><h1 data-ref="0/0/0/0/0/0/1/0">A four line statement of the promise, and more.</h1></div>
          </div>
          <p class="lead" data-ref="0/0/0/0/0/1">A two-line placeholder lead of comparable length that supports the statement above.</p>
          <div class="cta-flex" data-ref="0/0/0/0/0/2">
            <a class="btn" href="#" data-ref="0/0/0/0/0/2/0"><span data-ref="0/0/0/0/0/2/0/0">Apply</span><svg viewBox="0 0 20 15" aria-hidden="true" data-ref="0/0/0/0/0/2/0/1"><path d="M1 7.5h17M12 1.5l6 6-6 6" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
          </div>
        </div>
      </div>
      <div class="art" aria-hidden="true" data-ref="0/0/0/1/1">
        <!-- neutral stand-in for the illustration cluster: rounded shapes of the same footprint, no characters -->
        <svg viewBox="0 0 1173 724" preserveAspectRatio="xMidYMax slice">
          <g fill="#e6eef4">
            <rect x="620" y="60" width="300" height="220" rx="60"/><rect x="860" y="140" width="260" height="200" rx="60"/><rect x="480" y="260" width="280" height="240" rx="60"/><rect x="760" y="330" width="320" height="260" rx="70"/><rect x="560" y="500" width="360" height="224" rx="80"/>
          </g>
          <path d="M0 640 C 300 560, 600 700, 1173 600 V724 H0 Z" fill="#cfe5d3"/>
        </svg>
      </div>
    </div>
  </div>
</section>
</body>
</html>
